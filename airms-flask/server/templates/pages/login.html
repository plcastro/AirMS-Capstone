{% extends "base.html" %}

{% block content %}
<section class="card">

  <form class="form" method="post" action="#">

      <input type="email" name="email" placeholder="you@example.com" required>

      <input type="password" name="password" placeholder="********" required>

    <button type="submit">Sign In</button>
  </form>
</section>
{% endblock %}
