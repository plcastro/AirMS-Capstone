{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Login</h2>
  <form id="login-form" class="form-grid">
    <label>Username
      <input type="text" name="username" required />
    </label>
    <label>Password
      <input type="password" name="password" required />
    </label>
    <label>Role
      <select name="role">
        <option>mechanic</option>
        <option>admin</option>
        <option>maintenance manager</option>
        <option>pilot</option>
        <option>officer-in-charge</option>
        <option>warehouse department</option>
      </select>
    </label>
    <button class="btn" type="submit">Sign In</button>
  </form>
  <pre id="login-result" class="code-box"></pre>
</section>
{% endblock %}
