{% extends "layouts/auth_base.html" %}
{% block content %}
<form action="/api/user/login" method="post" data-api-form data-target="login-result">
  <div class="field"><label>Username or Email</label><input name="identifier" required /></div>
  <div class="field"><label>Password</label><input type="password" name="password" required /></div>
  <div class="field"><label>Base</label><select name="base"><option>MANILA</option><option>CEBU</option><option>CDO</option></select></div>
  <button type="submit">Login</button>
</form>
<pre id="login-result" class="muted"></pre>
{% endblock %}
