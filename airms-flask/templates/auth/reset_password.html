{% extends "layouts/auth_base.html" %}
{% block content %}
<form action="/api/user/reset-password" method="post" data-api-form>
  <div class="field"><label>Email</label><input name="email" type="email" required /></div>
  <div class="field"><label>Verification Code</label><input name="otp" maxlength="6" required /></div>
  <div class="field"><label>New Password</label><input name="password" type="password" required /></div>
  <button type="submit">Reset Password</button>
  <pre class="muted" data-form-result></pre>
</form>
{% endblock %}
