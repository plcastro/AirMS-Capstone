<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title or "AirMS" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">AirMS Flask</div>
    <nav>
      <a href="/">Home</a>
      <a href="/web/login">Login</a>
      <a href="/web/dashboard/maintenance-dashboard">Dashboard</a>
      <a href="/web/dashboard/maintenance-log">Maintenance</a>
      <a href="/web/dashboard/messages">Messages</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <small>AirMS Flask Backend UI</small>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
