<!doctype html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or 'AirMS Dashboard' }}</title>
  <link rel="stylesheet" href="{% static 'css/flask_web.css' %}" />
</head>
<body>
  <header class="top-nav">
    <div class="brand">AirMS</div>
    <div class="user-pill">Flask Web</div>
  </header>
  <div class="app-shell">
    <aside class="side-nav">
      {% for item in nav_items %}
      <a href="{{ item.href }}" class="nav-link {% if item.active %}active{% endif %}">{{ item.label }}</a>
      {% endfor %}
    </aside>
    <main class="page-content">
      <h2>{{ title }}</h2>
      {% block content %}{% endblock %}
    </main>
  </div>
<script src="{% static 'js/flask_web.js' %}"></script>
</body>
</html>
