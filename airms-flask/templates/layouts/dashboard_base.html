<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or 'AirMS Dashboard' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/flask_web.css') }}" />
</head>
<body>
  <header class="top-nav">
    <a class="brand" href="/web/dashboard/maintenance-dashboard">AirMS</a>
    <div class="top-actions">
      <span class="user-pill" id="current-user-pill">Flask Web</span>
      <button type="button" class="btn ghost small" data-logout>Logout</button>
    </div>
  </header>
  <div class="app-shell">
    <aside class="side-nav">
      {% for item in nav_items %}
      <a href="{{ item.href }}" class="nav-link {% if item.active %}active{% endif %}">{{ item.label }}</a>
      {% endfor %}
    </aside>
    <main class="page-content">
      <div class="page-heading">
        <h2>{{ title }}</h2>
        <p class="muted">{{ subtitle or '' }}</p>
      </div>
      {% block content %}{% endblock %}
    </main>
  </div>
<script src="{{ url_for('static', filename='js/flask_web.js') }}"></script>
</body>
</html>
