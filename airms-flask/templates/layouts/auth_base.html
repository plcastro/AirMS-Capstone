<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or 'AirMS' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/flask_web.css') }}" />
</head>
<body class="auth-bg">
  <main class="auth-shell">
    <section class="auth-card">
      <img class="auth-logo" src="{{ url_for('static', filename='img/AirMS_web.png') }}" alt="AirMS" />
      <h1>{{ title }}</h1>
      {% block content %}{% endblock %}
    </section>
  </main>
<script src="{{ url_for('static', filename='js/flask_web.js') }}"></script>
</body>
</html>
