<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "AirMS" }}</title>
  <style>
    body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background:#f6f8fc; color:#1f2937; }
    .topbar { background:#fff; border-bottom:1px solid #e5e7eb; padding:12px 18px; display:flex; justify-content:space-between; }
    .brand { font-weight:700; color:#0f172a; }
    .badge { font-size:12px; background:#e2e8f0; padding:4px 8px; border-radius:999px; }
    .container { max-width:1200px; margin:20px auto; padding:0 16px; }
    .panel { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:20px; }
    .path { font-family: Consolas, monospace; background:#0f172a; color:#dbeafe; padding:3px 8px; border-radius:6px; }
    .muted { color:#64748b; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">AirMS Flask Templates</div>
    <div class="badge">Template Preview</div>
  </header>
  <main class="container">
    <section class="panel">
      <h2>{{ title }}</h2>
      <p class="muted">Client-web route mirror:</p>
      <p><span class="path">{{ route_path }}</span></p>
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
