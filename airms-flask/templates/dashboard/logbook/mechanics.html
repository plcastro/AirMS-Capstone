{% extends "layouts/dashboard_base.html" %}
{% block content %}
<section class="mechanics-page" data-mechanics-page>
  <section class="card logbook-toolbar">
    <div class="field">
      <label for="mechanic-search">Search mechanic</label>
      <input id="mechanic-search" type="search" placeholder="Search mechanic" data-mechanic-search />
    </div>
    <div class="toolbar-actions">
      <button type="button" class="btn ghost" data-mechanic-back hidden>Back</button>
      <button type="button" class="btn ghost" data-mechanic-refresh>Refresh</button>
    </div>
  </section>

  <section class="card" data-mechanic-detail hidden></section>
  <section class="tab-bar" data-mechanic-tabs hidden></section>

  <section class="card table-card">
    <div class="table-scroll">
      <table class="table">
        <thead data-mechanic-head></thead>
        <tbody data-mechanic-table>
          <tr><td class="muted">Loading mechanics...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</section>

<script id="page-config" type="application/json">{{ page | tojson }}</script>
{% endblock %}
