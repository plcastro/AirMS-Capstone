{% extends "layouts/dashboard_base.html" %}
{% block content %}
<section class="reports-page" data-reports-page>
  <section class="reports-toolbar card">
    <div class="field">
      <label for="reports-search">Search</label>
      <input id="reports-search" type="search" placeholder="Search report modules" data-reports-search />
    </div>
    <div class="field">
      <label for="reports-export-type">Export</label>
      <select id="reports-export-type" data-reports-export-type>
        <option value="pdf">PDF / Print</option>
        <option value="csv">Excel / CSV</option>
      </select>
    </div>
    <div class="toolbar-actions">
      <button type="button" class="btn ghost" data-reports-refresh>Refresh</button>
      <button type="button" class="btn" data-reports-export>Export</button>
    </div>
  </section>

  <section class="report-section">
    <h2>Operations</h2>
    <div class="report-kpis" data-report-kpis></div>
  </section>

  <section class="report-section">
    <h2>Base Health</h2>
    <div class="base-health-grid">
      <article class="card">
        <div class="card-head">
          <h3>Base Damage Distribution</h3>
          <span class="muted" data-top-damaged-base></span>
        </div>
        <div class="mini-chart" data-damage-chart></div>
      </article>
      <article class="card">
        <div class="card-head">
          <h3>Base Repaired Distribution</h3>
          <span class="muted" data-top-repaired-base></span>
        </div>
        <div class="mini-chart" data-repair-chart></div>
      </article>
    </div>
  </section>

  <section class="card report-drilldown">
    <div class="card-head">
      <h3 data-drilldown-title>Insight Drilldown</h3>
      <div class="segmented" data-report-segments>
        <button type="button" class="tab-btn active" data-report-view="dueSoon">Due Soon</button>
        <button type="button" class="tab-btn" data-report-view="overdue">Overdue</button>
        <button type="button" class="tab-btn" data-report-view="completed">Completed</button>
        <button type="button" class="tab-btn" data-report-view="baseDamage">Base Damage</button>
        <button type="button" class="tab-btn" data-report-view="baseRepair">Base Repair</button>
      </div>
    </div>
    <div class="table-scroll">
      <table class="table" data-report-drilldown-table>
        <thead></thead>
        <tbody><tr><td class="muted">Loading report data...</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="report-section">
    <div class="report-section-head">
      <div>
        <h2 data-report-groups-title>Grouped Analytics Modules</h2>
        <p class="muted" data-report-groups-copy>Related tables and charts are grouped by domain for easier review.</p>
      </div>
    </div>
    <div class="report-groups" data-report-groups></div>
  </section>
</section>
<script id="page-config" type="application/json">{{ page | tojson }}</script>
{% endblock %}
